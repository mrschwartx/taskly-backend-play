play.http.secret.key = ${?AUTH_SECRET}
play.http.secret.key = ${?APPLICATION_SECRET}

play.modules.enabled += "com.taskly.backend.config.AppModule"

play.http.errorHandler = "com.taskly.backend.shared.infrastructure.http.ApiErrorHandler"
play.http.actionCreator = "com.taskly.backend.shared.infrastructure.http.ApiActionCreator"
play.http.actionComposition.executeActionCreatorActionFirst = true
play.http.parser.maxDiskBuffer = 3MiB

play.server.http.port = 8080
play.server.http.port = ${?APP_PORT}
play.server.http.address = "0.0.0.0"
play.server.http.address = ${?APP_HOST}

play.filters.enabled = [
  "com.taskly.backend.shared.infrastructure.http.RequestLoggingFilter",
  "play.filters.cors.CORSFilter"
]

play.filters.cors {
  pathPrefixes = ["/"]
  allowedOrigins = [${taskly.client-url}]
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
  allowedHttpHeaders = ["Content-Type", "Authorization"]
  supportsCredentials = true
  serveForbiddenOrigins = false
}

db.default {
  driver = "org.postgresql.Driver"
  url = ${?DATABASE_URL}
  username = ${?DATABASE_USER}
  password = ${?DATABASE_PASSWORD}
  hikaricp {
    maximumPoolSize = 10
    maximumPoolSize = ${?DATABASE_POOL_MAX}
    connectionTimeout = 30000
    connectionTimeout = ${?DATABASE_TIMEOUT}
  }
}

taskly {
  app {
    level = "development"
    level = ${?APP_LEVEL}
  }
  client-url = "http://localhost:3000"
  client-url = ${?CLIENT_URL}
  auth {
    secret = ""
    secret = ${?AUTH_SECRET}
    token-ttl = 1 hour
    cookie-name = "taskly_token"
    cookie-domain = ""
    cookie-domain = ${?COOKIE_DOMAIN}
    bcrypt-rounds = 10
    bcrypt-rounds = ${?BCRYPT_ROUNDS}
  }
  storage {
    public-dir = "public"
    public-dir = ${?PUBLIC_DIR}
    avatar-max-size = 2MiB
  }
  flyway {
    baseline-on-migrate = false
    baseline-on-migrate = ${?FLYWAY_BASELINE_ON_MIGRATE}
    baseline-version = "2"
    baseline-version = ${?FLYWAY_BASELINE_VERSION}
  }
  seed {
    allow-production = false
    allow-production = ${?SEED_ALLOW_PRODUCTION}
  }
}
